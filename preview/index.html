<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>阳光幼儿园 · 小程序 UI 预览</title>
<style>
/* =========================================================
   设计契约 / Design contract
   ---------------------------------------------------------
   使命：把「阳光幼儿园」小程序的首页、底部导航栏规范、相机页
        三屏放在一个深色画布上，供评审在浏览器里直接看稿并试用
        已定稿的交互（活动轮播 / 跑马灯 / tab 高亮 / + 按钮 tooltip）。
   比例：小程序 750rpx ≈ 390px 设计宽（2rpx ≈ 1px）。
   间距：只用 4 / 8 / 12 / 16 / 20 的倍数。
   颜色：
     页面底 #0F1319 · 手机壳描边 #232A36
     品牌蓝 #2E6BFF · 渐变蓝 linear-gradient(135deg,#59A2FF,#2E6BFF)
     正文 #1B1F27 · 次要 #8A93A3 · 未选中 #9AA1AD
     页面底（小程序内）#F4F6FA · 白卡 #FFF · 分割线 #F0F2F7
     状态胶囊底 #F1F3F8 · 红色 #F5333F
   圆角：卡片 14px · 屏幕 36px · 手机壳 44px
   阴影：白卡 0 10px 30px rgba(24,40,80,.06)
        活动卡 0 12px 30px rgba(0,0,0,.18)
        底部导航 0 -3px 12px rgba(24,40,80,.06)
   动效：state change 用 160–200ms 立即反馈；活动卡切换 500ms
        cubic-bezier(.22,.68,0,1)；+ 按钮 180ms 弹性缩放。
        Do：动效只表达状态变化；Don't：transition:all / 匀速线性。
        降级：prefers-reduced-motion 下位移归零、跑马灯停走。
   ========================================================= */

:root{
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;

  --page-bg:#0F1319;
  --page-ink:#EDF1F8;
  --page-ink-2:#8F9BAE;
  --bezel:#232A36;

  --brand:#2E6BFF;
  --brand-grad:linear-gradient(135deg,#59A2FF 0%,#2E6BFF 100%);
  --brand-soft:rgba(46,107,255,.1);
  --red:#F5333F;
  --hero-grad:linear-gradient(160deg,#FF6A5B 0%,#F5333F 46%,#D81E2E 100%);

  --surface:#FFFFFF;
  --page:#F4F6FA;
  --ink:#1B1F27;
  --ink-2:#8A93A3;
  --ink-idle:#9AA1AD;
  --line:#F0F2F7;
  --chip:#F1F3F8;
   /* 今日食谱主题（暖橙）与手机稿 4/5 专用 */
   --orange:#F08A00;
   --orange-deep:#E07B00;
   --orange-grad:linear-gradient(135deg,#FFB020,#F08A00);
   --orange-bar:linear-gradient(180deg,#FFB020,#F08A00);
   --orange-dash:#E3B98A;
   --ph-grad:linear-gradient(135deg,#FFE6C6,#FFD3A2);
   --ink-3:#5B6474;
   --pill-chip:#F1F4FA;
   --shadow-card-sm:0 5px 15px rgba(24,40,80,.06);

  --r-card:14px;
  --r-screen:36px;
  --r-shell:44px;
  --shadow-card:0 10px 30px rgba(24,40,80,.06);
  --shadow-banner:0 12px 30px rgba(0,0,0,.18);
  --shadow-tabbar:0 -3px 12px rgba(24,40,80,.06);

  --ease-out:cubic-bezier(.22,.68,0,1);
  --ease-spring:cubic-bezier(.16,1.02,.3,1);
  --t-fast:160ms;
  --t-base:200ms;
  --t-banner:500ms;
}

*,*::before,*::after{box-sizing:border-box}

html{ -webkit-text-size-adjust:100%; }
body{
  margin:0;
  min-height:100vh;
  padding:0 0 56px;
  background:radial-gradient(1100px 520px at 50% -8%, #17202E 0%, #0F1319 58%) no-repeat, var(--page-bg);
  color:var(--page-ink);
  font-family:var(--font);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
h1,h2,h3,p,figure,ul{margin:0}
ul{padding:0;list-style:none}
button{font-family:inherit}
svg{display:block}

/* ---------- 页面头部 ---------- */
.page{
  max-width:1320px;
  margin:0 auto;
  padding:40px 20px 8px;
}
.page__title{
  font-size:26px;
  font-weight:650;
  letter-spacing:.4px;
  line-height:1.3;
}
.page__lede{
  margin-top:8px;
  font-size:14px;
  line-height:1.6;
  color:var(--page-ink-2);
  max-width:760px;
}
.page__note{
  display:inline-flex;
  align-items:center;
  gap:8px;
  margin-top:12px;
  padding:6px 12px;
  border-radius:999px;
  background:rgba(46,107,255,.1);
  border:1px solid rgba(93,151,255,.24);
  color:#A8C2F2;
  font-size:12px;
  line-height:1.5;
}
.page__note b{
  color:#CFE0FF;
  font-weight:600;
}

/* ---------- 画布 ---------- */
.stage{
  max-width:1320px;
  margin:0 auto;
  padding:24px 20px 12px;
  display:flex;
  flex-wrap:wrap;
  align-items:flex-start;
  justify-content:center;
  gap:36px 28px;
}
.device{
  width:406px;                 /* 8px 描边 ×2 + 390 屏幕 */
  max-width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:14px;
}
 .shell{
   width:100%;
   height:844px;
   padding:8px;
   border-radius:var(--r-shell);
   background:linear-gradient(180deg,#2B323E 0%,#1D232D 100%);
   box-shadow:
     0 30px 70px rgba(0,0,0,.55),
     0 6px 18px rgba(0,0,0,.4),
     inset 0 0 0 1px rgba(255,255,255,.07);
 }
.screen{
  position:relative;
  width:100%;
  height:100%;
  border-radius:var(--r-screen);
  overflow:hidden;
  background:var(--page);
  display:flex;
  flex-direction:column;
  color:var(--ink);
  font-size:14px;
  line-height:1.4;
}
 .device__caption{
   font-size:12.5px;
   color:var(--page-ink-2);
   text-align:center;
   line-height:1.5;
   letter-spacing:.2px;
 }
 .device__note{
   display:block;
   margin-top:6px;
   font-size:11.5px;
   line-height:17px;
   color:#7E8B9E;
 }
 .device__note::before{
   content:"";
   display:inline-block;
   width:5px;
   height:5px;
   margin-right:6px;
   border-radius:2px;
   background:rgba(127,178,255,.75);
   vertical-align:2px;
 }
.device__caption b{
  display:inline-block;
  margin-right:6px;
  padding:1px 6px;
  border-radius:6px;
  background:rgba(255,255,255,.08);
  color:#B9C6DA;
  font-size:11px;
  font-weight:600;
  letter-spacing:.5px;
  vertical-align:1px;
}

/* 键盘焦点：所有可操作元素统一可见焦点环 */
.tab:focus-visible,
.dot:focus-visible,
.nav-add:focus-visible,
.status__bell:focus-visible,
.cam__circle:focus-visible,
.cam__shutter:focus-visible{
  outline:2px solid #7FB2FF;
  outline-offset:2px;
}

/* =========================================================
   手机稿 1 · 首页
   ========================================================= */

/* ---------- 1. 顶部红色活动滚动屏 ---------- */
.hero{
  position:relative;
  flex:0 0 auto;
  padding:8px 0 12px;
  background:var(--hero-grad);
  border-radius:0 0 18px 18px;
  overflow:hidden;
}
.hero__glow{
  position:absolute;
  border-radius:50%;
  background:rgba(255,255,255,.14);
  filter:blur(6px);
  pointer-events:none;
}
.hero__glow--tl{ width:216px; height:216px; top:-86px; left:-72px; }
.hero__glow--br{ width:244px; height:244px; right:-86px; bottom:-104px; }
.hero__body{ position:relative; z-index:1; }

.status{
  height:22px;
  padding:0 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  color:#fff;
}
.status__time{ font-size:14px; font-weight:600; letter-spacing:.3px; }
.status__icons{ display:flex; align-items:center; gap:5px; opacity:.95; }

 .apphead{
   height:38px;
   margin-top:2px;
   padding:0 16px;
   display:flex;
   align-items:center;
   justify-content:flex-start;   /* 铃铛紧跟文字块，右上角留空避让微信胶囊 */
   gap:0;
 }
 .apphead__logo{
   flex:0 0 auto;
   width:38px;
   height:38px;
   margin-right:10px;
   border-radius:12px;
   background:rgba(255,255,255,.22);
   border:1px solid rgba(255,255,255,.26);
   color:#fff;
   font-size:17px;
   font-weight:700;
   display:grid;
   place-items:center;
 }
 .apphead__text{ flex:0 1 auto; min-width:0; }
.apphead__title{
  color:#fff;
  font-size:15px;
  font-weight:600;
  letter-spacing:.3px;
  line-height:19px;
}
.apphead__sub{
  color:rgba(255,255,255,.82);
  font-size:11.5px;
  line-height:16px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
 .status__bell{
   position:relative;
   flex:0 0 auto;
   margin-left:8px;
   width:32px;
   height:32px;
   border-radius:50%;
   border:0;
   background:rgba(255,255,255,.22);
   display:grid;
   place-items:center;
   cursor:pointer;
   transition:background var(--t-fast) var(--ease-out), transform var(--t-fast) var(--ease-out);
 }
.status__bell:hover{ background:rgba(255,255,255,.32); }
.status__bell:active{ transform:scale(.92); }
.status__badge{
  position:absolute;
  top:1px;
  right:1px;
  width:8px;
  height:8px;
  border-radius:50%;
  background:#FFD233;
  box-shadow:0 0 0 1.5px rgba(240,60,60,.55);
}

/* 活动卡 */
.hero__banner{ margin-top:10px; }
.banner{
  position:relative;
  height:158px;
  margin:0 16px;
}
.banner__card{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:16px;
  border-radius:var(--r-card);
  background:var(--card-grad,#3A5BFF);
  box-shadow:var(--shadow-banner);
  color:#fff;
  opacity:0;
  transform:translateX(16px) scale(.985);
  pointer-events:none;
  transition:opacity var(--t-banner) var(--ease-out), transform var(--t-banner) var(--ease-out);
}
.banner__card.is-active{
  opacity:1;
  transform:none;
  pointer-events:auto;
}
.banner__card--c1{ --card-grad:linear-gradient(135deg,#3A5BFF 0%,#1E2F8F 100%); }
.banner__card--c2{ --card-grad:linear-gradient(135deg,#FF7A59 0%,#F0432B 100%); }
.banner__card--c3{ --card-grad:linear-gradient(135deg,#22C1A6 0%,#0E9E8A 100%); }
.banner__card--c4{ --card-grad:linear-gradient(135deg,#FFB020 0%,#F08A00 100%); }
.banner__card--c5{ --card-grad:linear-gradient(135deg,#8A6BFF 0%,#5B34E8 100%); }

.banner__text{ flex:1 1 auto; min-width:0; }
.banner__tag{
  display:inline-block;
  padding:3px 9px;
  border-radius:999px;
  background:rgba(255,255,255,.24);
  color:#fff;
  font-size:11.5px;
  font-weight:600;
  line-height:16px;
  letter-spacing:.4px;
}
.banner__title{
  margin-top:8px;
  color:#fff;
  font-size:21px;
  font-weight:700;
  line-height:26px;
  letter-spacing:.3px;
}
.banner__sub{
  margin-top:5px;
  color:rgba(255,255,255,.8);
  font-size:12.5px;
  line-height:17px;
}
.banner__art{
  flex:0 0 auto;
  width:66px;
  height:66px;
  border-radius:16px;
  background:rgba(255,255,255,.22);
  border:1px solid rgba(255,255,255,.35);
  color:#fff;
  font-size:15px;
  font-weight:600;
  letter-spacing:.5px;
  display:grid;
  place-items:center;
}

/* 指示点：可视 6px，命中区 10×16 */
.banner__dots{
  height:16px;
  margin-top:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}
.dot{
  position:relative;
  width:10px;
  height:16px;
  margin:0 -2px;
  padding:0;
  border:0;
  background:transparent;
  cursor:pointer;
}
.dot::before{
  content:"";
  position:absolute;
  top:50%;
  left:50%;
  width:6px;
  height:6px;
  border-radius:50%;
  background:rgba(255,255,255,.42);
  transform:translate(-50%,-50%);
  transition:width var(--t-base) var(--ease-out), background var(--t-fast) var(--ease-out);
}
.dot.is-active::before{
  width:14px;
  border-radius:3px;
  background:#fff;
}
.dot:active::before{ background:rgba(255,255,255,.75); }
.dot.is-active:active::before{ background:#fff; }

/* 跑马灯公告条 */
.marquee{
  height:32px;
  margin:10px 16px 0;
  padding:0 10px 0 5px;
  border-radius:16px;
  background:rgba(255,255,255,.2);
  display:flex;
  align-items:center;
  gap:8px;
  overflow:hidden;
}
.marquee__tag{
  flex:0 0 auto;
  padding:3px 8px;
  border-radius:9px;
  background:#fff;
  color:var(--red);
  font-size:11px;
  font-weight:700;
  line-height:14px;
  letter-spacing:.3px;
}
.marquee__viewport{
  flex:1 1 auto;
  min-width:0;
  overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 10px,#000 calc(100% - 10px),transparent 100%);
  mask-image:linear-gradient(90deg,transparent 0,#000 10px,#000 calc(100% - 10px),transparent 100%);
}
.marquee__track{
  display:inline-flex;
  align-items:center;
  white-space:nowrap;
  will-change:transform;
  animation:marquee-scroll 18s linear infinite;
}
.marquee__copy{
  padding-right:14px;
  color:rgba(255,255,255,.94);
  font-size:12px;
  line-height:32px;
}
@keyframes marquee-scroll{
  from{ transform:translateX(0); }
  to{ transform:translateX(-50%); }
}

/* ---------- 2. 浅色内容区 ---------- */
.content{
  flex:1 1 auto;
  min-height:0;
  padding:8px 16px;
  display:flex;
  flex-direction:column;
  gap:8px;
  overflow-y:auto;
  scrollbar-width:none;
}
.content::-webkit-scrollbar{ width:0; height:0; }

.card{
  flex:0 0 auto;
  background:var(--surface);
  border-radius:var(--r-card);
  box-shadow:var(--shadow-card);
}
.card__head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}
 .card__title{
   position:relative;
   padding-left:10px;
   font-size:15px;
   font-weight:600;
   line-height:19px;
   color:var(--ink);
 }
 /* 从顶部欢迎语挪到卡片标题旁的日期 */
 .card__date{
   margin-left:7px;
   font-size:12px;
   font-weight:400;
   letter-spacing:0;
   color:var(--ink-2);
 }
.card__title::before{
  content:"";
  position:absolute;
  left:0;
  top:50%;
  width:4px;
  height:13px;
  border-radius:2px;
  background:var(--red);
  transform:translateY(-50%);
}
.card__more{
  display:inline-flex;
  align-items:center;
  gap:2px;
  font-size:12px;
  color:var(--ink-2);
  line-height:16px;
}

/* 快捷入口 */
.quick{
   padding:16px 8px;
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:4px;
}
.quick__item{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
  min-width:0;
}
.quick__icon{
  width:42px;
  height:42px;
  border-radius:12px;
  color:#fff;
  font-size:17px;
  font-weight:600;
  display:grid;
  place-items:center;
  box-shadow:0 6px 14px rgba(24,40,80,.12);
}
.quick__icon--food{ background:linear-gradient(135deg,#FFB020,#F08A00); }
.quick__icon--leave{ background:linear-gradient(135deg,#4C8BFF,#2D5FEF); }
.quick__icon--notice{ background:linear-gradient(135deg,#3FC5A0,#12A182); }
.quick__icon--archive{ background:linear-gradient(135deg,#FF7A59,#F0432B); }
.quick__label{
  font-size:11px;
  line-height:14px;
  color:var(--ink-2);
  white-space:nowrap;
}

/* 今日安排 */
 .sched{ padding:12px 14px; }
.sched__list{
   margin-top:8px;
  display:flex;
  flex-direction:column;
  gap:2px;
}
.sched__row{
  display:grid;
  grid-template-columns:40px 7px minmax(0,1fr) auto;
  align-items:center;
  column-gap:8px;
   padding:4px 0;
  min-height:42px;
}
.sched__time{
  font-size:12.5px;
  font-weight:700;
  color:var(--brand);
  letter-spacing:.2px;
}
.sched__dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#D7DEEC;
}
.sched__dot--live{ background:var(--brand); }
.sched__text{ min-width:0; }
.sched__name{
  display:block;
  font-size:13.5px;
  line-height:18px;
  color:var(--ink);
  font-weight:500;
  overflow-wrap:anywhere;
}
.sched__meta{
  display:block;
  font-size:11.5px;
  line-height:16px;
  color:var(--ink-2);
}
.pill{
  flex:0 0 auto;
  padding:2px 8px;
  border-radius:999px;
  font-size:11px;
  line-height:15px;
  white-space:nowrap;
  background:var(--chip);
  color:var(--ink-2);
}
.pill--live{
  background:var(--brand-soft);
  color:var(--brand);
  font-weight:600;
}

/* 最新通知 */
 .notices{ padding:12px 14px; }
 .notices__list{ margin-top:6px; }
 .notice{
   display:grid;
   grid-template-columns:6px minmax(0,1fr) 14px;
   align-items:center;
   column-gap:10px;
   padding:7px 0;
 }
 .notice + .notice{ border-top:1px solid var(--line); }
 .notice__dot{
   width:6px;
   height:6px;
   border-radius:50%;
   background:var(--brand);
 }
 .notice__dot--orange{ background:#F58A00; }
 .notice__dot--teal{ background:#12A182; }
 .notice__text{ min-width:0; }
 .notice__title{
   display:block;
   font-size:13.5px;
   line-height:18px;
   color:var(--ink);
   overflow-wrap:anywhere;
 }
 .notice__time{
   display:block;
   font-size:11.5px;
   line-height:15px;
   color:var(--ink-idle);
 }

/* ---------- 3. 底部导航栏 ---------- */
.tabbar{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  z-index:6;
  background:var(--surface);
  box-shadow:var(--shadow-tabbar);
}
.tabbar__bar{
  height:54px;
  display:grid;
  grid-template-columns:repeat(5,1fr);
}
.tab{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  padding:6px 0 0;
  border:0;
  background:transparent;
  color:var(--ink-idle);
  cursor:pointer;
  transition:color var(--t-fast) var(--ease-out), transform var(--t-fast) var(--ease-out);
}
.tab__icon{ width:24px; height:24px; }
.tab__label{
  font-size:12px;
  line-height:14px;
  letter-spacing:.2px;
}
.tab.is-active{ color:var(--brand); }
.tab.is-active .tab__label{ font-weight:600; }
.tab:active{ transform:scale(.94); }
.tab__bar{
  opacity:0;
  transition:opacity var(--t-base) var(--ease-out);
}
.tab.is-active .tab__bar{ opacity:1; }
.tabbar__slot{ pointer-events:none; }

.tabbar__home{
  height:22px;
  display:flex;
  align-items:flex-start;
  justify-content:center;
}
.tabbar__home span{
  width:130px;
  height:5px;
  border-radius:3px;
  background:rgba(27,31,39,.32);
}

/* 中间凸起的「扫一扫」按钮：底边距屏幕底 36px → 顶部高出导航条 22px */
.nav-add{
  position:absolute;
  left:50%;
  bottom:36px;
  transform:translateX(-50%);
  width:62px;
  height:62px;
  padding:6px 0 0;
  border-radius:50%;
  border:4px solid #fff;
  background:var(--brand-grad);
  box-shadow:0 6px 14px rgba(46,107,255,.38);
  color:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
  cursor:pointer;
  transition:transform 180ms var(--ease-spring), box-shadow 180ms var(--ease-out);
}
.nav-add:hover{

/* 深色 tooltip（+ 按钮 / 通知铃铛共用） */
.tip{
  position:absolute;
  left:50%;
  bottom:calc(100% + 10px);
  transform:translate(-50%,6px) scale(.96);
  transform-origin:50% 100%;
  max-width:220px;
  padding:8px 10px;
  border-radius:10px;
  background:rgba(22,26,34,.94);
  color:#fff;
  font-size:12px;
  font-weight:500;
  line-height:1.2;
  white-space:nowrap;
  opacity:0;
  pointer-events:none;
  transition:opacity var(--t-fast) var(--ease-out), transform var(--t-base) var(--ease-spring);
  z-index:20;
}
.tip::after{
  content:"";
  position:absolute;
  top:100%;
  left:50%;
  transform:translateX(-50%);
  border:5px solid transparent;
  border-top-color:rgba(22,26,34,.94);
}
 .tip--below{
   top:calc(100% + 8px);
   bottom:auto;
   left:auto;
   right:-2px;
   transform:translateY(-6px) scale(.96);
   transform-origin:100% 0;
 }
 .tip--below::after{
   top:auto;
   bottom:100%;
   left:auto;
   right:14px;
   transform:none;
   border-top-color:transparent;
   border-bottom-color:rgba(22,26,34,.94);
 }
 .has-tip .tip{
   opacity:1;
   transform:translate(-50%,0) scale(1);
 }
 .has-tip .tip--below{ transform:translateY(0) scale(1); }

<script>
(function () {
  'use strict';

  /* ---------------- 1. 首页活动滚动屏：每 3.6s 切换 ---------------- */
  var bannerWrap = document.querySelector('[data-banner]');

  if (bannerWrap) {
    var cards = Array.prototype.slice.call(bannerWrap.querySelectorAll('.banner__card'));
    var dots = Array.prototype.slice.call(bannerWrap.querySelectorAll('.dot'));
    var AUTOPLAY = 3600;
    var current = 0;
    var timer = null;

    var show = function (next) {
      current = (next + cards.length) % cards.length;
      cards.forEach(function (card, i) {
        var on = i === current;
        card.classList.toggle('is-active', on);
        card.setAttribute('aria-hidden', on ? 'false' : 'true');
      });
      dots.forEach(function (dot, i) {
        var on = i === current;
        dot.classList.toggle('is-active', on);
        if (on) { dot.setAttribute('aria-current', 'true'); }
        else { dot.removeAttribute('aria-current'); }
      });
    };

    var stopAuto = function () {
      if (timer) { window.clearInterval(timer); timer = null; }
    };

    var startAuto = function () {
      stopAuto();
      timer = window.setInterval(function () { show(current + 1); }, AUTOPLAY);
    };

    dots.forEach(function (dot, i) {
      dot.addEventListener('click', function () {
        show(i);
        startAuto();          // 手动选择后从该张重新计时
      });
    });

    document.addEventListener('visibilitychange', function () {
      if (document.hidden) { stopAuto(); } else { startAuto(); }
    });

    show(0);
    startAuto();
  }

  /* ---------------- 2. 底部 tab 高亮切换 ---------------- */
  Array.prototype.slice.call(document.querySelectorAll('[data-tabs]')).forEach(function (group) {
    var tabs = Array.prototype.slice.call(group.querySelectorAll('.tab'));
    if (!tabs.length) { return; }

    var activate = function (tab) {
      tabs.forEach(function (t) {
        var on = t === tab;
        t.classList.toggle('is-active', on);
        if (on) { t.setAttribute('aria-current', 'page'); }
        else { t.removeAttribute('aria-current'); }
      });
    };

    tabs.forEach(function (tab, i) {
      tab.addEventListener('click', function () { activate(tab); });
      tab.addEventListener('keydown', function (e) {
        if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') { return; }
        e.preventDefault();
        var step = e.key === 'ArrowRight' ? 1 : -1;
        var next = tabs[(i + step + tabs.length) % tabs.length];
        next.focus();
        activate(next);
      });
    });
  });

  /* ---------------- 3. 深色 tooltip（+ 按钮 / 通知铃铛） ---------------- */
  (function () {
    var triggers = Array.prototype.slice.call(document.querySelectorAll('[data-tip]'));
    var open = null;
    var hideTimer = null;

    var hide = function () {
      if (!open) { return; }
      window.clearTimeout(hideTimer);
      var tip = open.querySelector('.tip');
      open.classList.remove('has-tip');
      if (tip) { tip.textContent = ''; }
      open = null;
    };

    triggers.forEach(function (el) {
      var tip = el.querySelector('.tip');
      if (!tip) { return; }

      el.addEventListener('click', function (e) {
        e.stopPropagation();
        var wasOpen = open === el;
        hide();
        if (wasOpen) { return; }
        tip.textContent = el.getAttribute('data-tip') || '';
        el.classList.add('has-tip');
        open = el;
        hideTimer = window.setTimeout(hide, 1600);
      });

      el.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') { hide(); }
      });
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { hide(); }
    });

    document.addEventListener('click', function (e) {
      if (open && !open.contains(e.target)) { hide(); }
    });
  })();
})();
</script>
